<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para mi cachetes 💗</title>
    <style>
        body { margin: 0; background-color: #ffffff; overflow: hidden; font-family: 'Arial', sans-serif; }
        #interfaz {
            position: absolute;
            top: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 40px 0;
            pointer-events: none; /* Para que no estorbe al 3D */
            z-index: 10;
        }
        .texto-arriba { font-size: 24px; color: #333; font-weight: bold; }
        .texto-abajo { font-size: 35px; color: #000; font-weight: bold; }
    </style>
</head>
<body>

    <div id="interfaz">
        <div class="texto-arriba">Yo cuando aprenda a programar</div>
        <div class="texto-abajo">para mí cachetes 💗</div>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xffffff);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // Cuadrícula igual al video
        const gridHelper = new THREE.GridHelper(4, 10, 0x888888, 0xcccccc);
        gridHelper.rotation.x = Math.PI / 2;
        scene.add(gridHelper);

        const points = [];
        for (let x = -1.5; x <= 1.5; x += 0.08) {
            for (let y = -1.5; y <= 1.5; y += 0.08) {
                for (let z = -1.5; z <= 1.5; z += 0.08) {
                    const x2 = x*x, y2 = y*y, z2 = z*z;
                    const equation = Math.pow(x2 + (9/4)*y2 + z2 - 1, 3) - x2*Math.pow(z, 3) - (9/80)*y2*Math.pow(z, 3);
                    if (equation <= 0) {
                        points.push(new THREE.Vector3(x, y, z));
                    }
                }
            }
        }

        const geometry = new THREE.BufferGeometry().setFromPoints(points);
        const material = new THREE.PointsMaterial({ color: 0xff0000, size: 0.025 });
        const heart = new THREE.Points(geometry, material);
        
        heart.rotation.x = -Math.PI / 2;
        scene.add(heart);

        camera.position.set(1.5, 1.5, 3);
        camera.lookAt(0, 0, 0);

        function animate() {
            requestAnimationFrame(animate);
            heart.rotation.z += 0.012; // Rotación como en el video
            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
