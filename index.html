<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Para mi cachetes 💗</title>
    <style>
        body { margin: 0; background-color: #ffffff; overflow: hidden; font-family: sans-serif; }
        .texto {
            position: absolute;
            width: 100%;
            text-align: center;
            color: #000;
            font-weight: bold;
            z-index: 10;
            bottom: 50px; /* Lo sitúa en la parte inferior */
            font-size: 35px;
        }
    </style>
</head>
<body>

    <div class="texto">para mí cachetes 💗</div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xffffff);
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        const grid = new THREE.GridHelper(5, 15, 0x888888, 0xcccccc);
        grid.rotation.x = Math.PI / 2;
        scene.add(grid);

        const vertices = [];
        for (let x = -1.5; x <= 1.5; x += 0.08) {
            for (let y = -1.5; y <= 1.5; y += 0.08) {
                for (let z = -1.5; z <= 1.5; z += 0.08) {
                    const x2 = x*x, y2 = y*y, z2 = z*z;
                    if (Math.pow(x2 + (9/4)*y2 + z2 - 1, 3) - x2*Math.pow(z, 3) - (9/80)*y2*Math.pow(z, 3) <= 0) {
                        vertices.push(x, y, z);
                    }
                }
            }
        }

        const geometry = new THREE.BufferGeometry();
        geometry.setAttribute('position', new THREE.Float32BufferAttribute(vertices, 3));
        const material = new THREE.PointsMaterial({ color: 0xff0000, size: 0.03 });
        const heart = new THREE.Points(geometry, material);
        heart.rotation.x = -Math.PI / 2;
        scene.add(heart);

        camera.position.set(2, 2, 3);
        camera.lookAt(0, 0, 0);

        function animate() {
            requestAnimationFrame(animate);
            heart.rotation.z += 0.015;
            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
